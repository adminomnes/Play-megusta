<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quién eres? | Play Me Gusta</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png"
        href="https://i.ibb.co/Y4phrnwx/Chat-GPT-Image-8-feb-2026-22-26-29-removebg-preview.png">
    <link rel="stylesheet" href="assets/a11y.css">
    <script defer src="assets/a11y.js"></script>
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-purple: #8b00ff;
            --neon-pink: #ff006e;
            --neon-blue: #4D96FF;
            --neon-orange: #FF6B35;
            --neon-green: #39FF14;
            --neon-yellow: #FFE66D;

            --bg-deep: #0a0a0f;
            --bg-dark: #12121f;

            --transition-smooth: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 25% 40%, rgba(139, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 75% 60%, rgba(0, 255, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 0, 255, 0.08) 0%, transparent 40%);
            animation: bgShift 20s ease infinite;
            pointer-events: none;
        }

        @keyframes bgShift {

            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* Floating dots */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(1.5px 1.5px at 15% 25%, rgba(0, 255, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 85% 35%, rgba(255, 0, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 45% 75%, rgba(139, 0, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 70% 15%, rgba(0, 217, 255, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 30% 90%, rgba(255, 0, 110, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 55% 45%, rgba(57, 255, 20, 0.3), transparent);
            background-size: 200% 200%;
            animation: floatDots 25s ease infinite;
            pointer-events: none;
        }

        @keyframes floatDots {

            0%,
            100% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }
        }

        /* Container */
        .profile-selector {
            text-align: center;
            z-index: 10;
            position: relative;
            animation: fadeIn 1s ease-out;
            width: 95%;
            max-width: 1000px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Title */
        .title {
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 300;
            margin-bottom: 55px;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 1px;
        }

        /* Profiles Grid */
        .profiles-row {
            display: flex;
            justify-content: center;
            gap: clamp(20px, 5vw, 60px);
            flex-wrap: wrap;
        }

        /* Profile Card */
        .profile-card {
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .profile-card:hover {
            transform: scale(1.1);
        }

        /* Avatar - Character Box */
        .avatar-box {
            width: clamp(120px, 18vw, 180px);
            height: clamp(120px, 18vw, 180px);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            transition: var(--transition-smooth);
            border: 3px solid rgba(255, 255, 255, 0.08);
        }

        /* Character face using CSS */
        .character {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Fur texture effect */
        .character::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle 3px, rgba(255, 255, 255, 0.08) 100%, transparent),
                radial-gradient(circle 2px, rgba(255, 255, 255, 0.05) 100%, transparent);
            background-size: 8px 8px, 6px 6px;
            background-position: 0 0, 4px 4px;
        }

        .eyes {
            display: flex;
            gap: 18px;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }

        .eye {
            width: 28px;
            height: 28px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #111;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: 0.3s;
        }

        .eye::before {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            top: 7px;
            right: 7px;
            z-index: 3;
        }

        .profile-card:hover .eye::after {
            width: 16px;
            height: 16px;
        }

        .mouth {
            width: 30px;
            height: 14px;
            border-bottom: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 0 0 50% 50%;
            position: relative;
            z-index: 2;
            transition: 0.3s;
        }

        .profile-card:hover .mouth {
            width: 40px;
            height: 18px;
            border-bottom-color: #fff;
        }

        /* Character 1 - Cyan (Adult main) */
        .char-cyan .character {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
        }

        .char-cyan:hover .avatar-box {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5), 0 0 80px rgba(0, 255, 255, 0.2);
        }

        /* Character 2 - Red/Orange (Adult 2) */
        .char-red .character {
            background: linear-gradient(135deg, #e63946, #c1121f);
        }

        .char-red:hover .avatar-box {
            border-color: var(--neon-orange);
            box-shadow: 0 0 40px rgba(255, 107, 53, 0.5), 0 0 80px rgba(255, 107, 53, 0.2);
        }

        /* Character 3 - Yellow (Kids) */
        .char-yellow .character {
            background: linear-gradient(135deg, #FFD60A, #FFC300);
        }

        .char-yellow .eye::after {
            background: #333;
        }

        .char-yellow:hover .avatar-box {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 40px rgba(255, 230, 109, 0.5), 0 0 80px rgba(255, 230, 109, 0.2);
        }

        /* Character 4 - Pink (Kids) */
        .char-pink .character {
            background: linear-gradient(135deg, #FF6EC7, #ff006e);
        }

        .char-pink:hover .avatar-box {
            border-color: var(--neon-pink);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.5), 0 0 80px rgba(255, 0, 110, 0.2);
        }

        /* Profile Name */
        .profile-name {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            transition: var(--transition-smooth);
            letter-spacing: 0.5px;
        }

        .profile-card:hover .profile-name {
            color: #fff;
        }

        /* Profile type label */
        .profile-type {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: -5px;
            transition: var(--transition-smooth);
        }

        .type-adult {
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .type-kids {
            color: var(--neon-yellow);
            border: 1px solid rgba(255, 230, 109, 0.2);
        }

        .profile-card:hover .type-adult {
            background: rgba(0, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .profile-card:hover .type-kids {
            background: rgba(255, 230, 109, 0.1);
            border-color: rgba(255, 230, 109, 0.5);
            box-shadow: 0 0 15px rgba(255, 230, 109, 0.2);
        }

        /* Manage Button */
        .manage-btn {
            margin-top: 55px;
            background: transparent;
            color: rgba(255, 255, 255, 0.45);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            padding: 12px 35px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: 'Outfit', sans-serif;
        }

        .manage-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .title {
                font-size: 1.6rem;
                margin-bottom: 40px;
            }

            .profiles-row {
                gap: 25px;
            }

            .avatar-box {
                width: 120px;
                height: 120px;
            }

            .eyes {
                gap: 14px;
            }

            .eye {
                width: 22px;
                height: 22px;
            }

            .eye::after {
                width: 11px;
                height: 11px;
            }

            .eye::before {
                width: 4px;
                height: 4px;
                top: 5px;
                right: 5px;
            }

            .mouth {
                width: 24px;
                height: 12px;
            }

            .manage-btn {
                margin-top: 35px;
                padding: 10px 25px;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.4rem;
                margin-bottom: 30px;
            }

            .profiles-row {
                gap: 18px;
            }

            .avatar-box {
                width: 100px;
                height: 100px;
                border-radius: 16px;
            }

            .eyes {
                gap: 12px;
            }

            .eye {
                width: 18px;
                height: 18px;
            }

            .eye::after {
                width: 9px;
                height: 9px;
            }

            .mouth {
                width: 20px;
                height: 10px;
                border-bottom-width: 3px;
            }

            .profile-name {
                font-size: 0.8rem;
            }

            .profile-type {
                font-size: 0.55rem;
                padding: 3px 8px;
            }

            .manage-btn {
                margin-top: 25px;
                padding: 8px 20px;
                font-size: 0.7rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="main" class="profile-selector">
        <h1 class="title">¿Quién eres? Elige tu perfil</h1>

        <div class="profiles-row">

            <!-- Perfil Adulto - Play -->
            <div class="profile-card char-cyan" onclick="selectProfile('adult')" role="button" tabindex="0"
                aria-label="Perfil Play Me Gusta">
                <div class="avatar-box">
                    <div class="character">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                </div>
                <div class="profile-name">Play Me Gusta</div>
                <div class="profile-type type-adult">Principal</div>
            </div>

            <!-- Perfil Kids - Infantil -->
            <div class="profile-card char-yellow" onclick="selectProfile('kids')" role="button" tabindex="0"
                aria-label="Perfil Infantil Kids Mode">
                <div class="avatar-box">
                    <div class="character">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                </div>
                <div class="profile-name">Infantil</div>
                <div class="profile-type type-kids">Kids Mode</div>
            </div>

        </div>

        <button class="manage-btn">Administrar perfiles</button>
    </div>

    <script src="js/flow-controller.js"></script>
    <script>
        // Auth check
        document.addEventListener('DOMContentLoaded', () => {
            if (window.FlowController) window.FlowController.checkAccess();
        });

        // Profile selection
        window.selectProfile = (type) => {
            if (window.FlowController) window.FlowController.setProfileMode(type);
        };

        // Eyes follow mouse
        document.addEventListener('mousemove', (e) => {
            const eyes = document.querySelectorAll('.eye::after');
            document.querySelectorAll('.eye').forEach(eye => {
                const rect = eye.getBoundingClientRect();
                const eyeCenterX = rect.left + rect.width / 2;
                const eyeCenterY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
                const distance = 3;
                const pupilX = Math.cos(angle) * distance;
                const pupilY = Math.sin(angle) * distance;
                const pupil = eye.querySelector('::after') || eye;
                eye.style.setProperty('--pupil-x', `${pupilX}px`);
                eye.style.setProperty('--pupil-y', `${pupilY}px`);
            });
        });

        // Apply pupil movement with CSS
        const style = document.createElement('style');
        style.textContent = `
            .eye::after {
                transform: translate(calc(-50% + var(--pupil-x, 0px)), calc(-50% + var(--pupil-y, 0px))) !important;
            }
        `;
        document.head.appendChild(style);

        // Manage button
        document.querySelector('.manage-btn').onclick = () => {
            alert('Funcionalidad de administración de perfiles próximamente.');
        };
    </script>
</body>

</html>
