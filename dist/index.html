<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Me Gusta | El Futuro del Streaming</title>

    <!-- Google Fonts: Outfit (Modern & Elegant) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;600;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Design System -->
    <link rel="stylesheet" href="css/landing.css?v=nft_v1">
    <link rel="icon" type="image/png"
        href="https://i.ibb.co/Y4phrnwx/Chat-GPT-Image-8-feb-2026-22-26-29-removebg-preview.png">
    <link rel="stylesheet" href="assets/a11y.css">
    <script defer src="assets/a11y.js"></script>
    <!-- Custom Styles moved to css/landing.css -->
    <style>
        /* Styles unified in css/landing.css */
    </style>
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <!-- AURORA BACKGROUND -->
    <div class="aurora-container">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div id="main" class="loading-portal">
        <div class="brand-logo-massive" data-reveal>
            <img src="https://i.ibb.co/99Tdd8t1/Dise-o-sin-t-tulo-9-removebg-preview.png" alt="Radio Me Gusta">
        </div>

        <div class="auth-portal-card reveal">
            <div class="auth-tabs">
                <button id="btn-login" class="active" onclick="toggleAuth('login')">LOGIN</button>
                <button id="btn-register" onclick="toggleAuth('register')">REGISTRO</button>
            </div>

            <form id="login-form">
                <input type="email" placeholder="Email" class="auth-input" required>
                <input type="password" placeholder="Contraseña" class="auth-input" required>
                <button type="submit" class="btn-submit">ENTRAR AL IMPERIO</button>
            </form>

            <form id="register-form" style="display: none;">
                <input type="text" placeholder="Nombre completo" class="auth-input" required>
                <input type="email" placeholder="Email" class="auth-input" required>
                <input type="password" placeholder="Crear contraseña" class="auth-input" required>
                <button type="submit" class="btn-submit">CREAR MI CUENTA</button>
            </form>

            <div class="social-links"
                style="display:flex; justify-content:center; gap:25px; margin-top:30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 25px;">
                <a href="https://www.youtube.com/@Programados-cl" target="_blank"
                    style="color:rgba(255,255,255,0.4); transition:0.3s;" onmouseover="this.style.color='#ff0000'"
                    onmouseout="this.style.color='rgba(255,255,255,0.4)'"><i data-lucide="youtube"></i></a>
                <a href="https://instagram.com/radiome.gusta" target="_blank"
                    style="color:rgba(255,255,255,0.4); transition:0.3s;" onmouseover="this.style.color='#e1306c'"
                    onmouseout="this.style.color='rgba(255,255,255,0.4)'"><i data-lucide="instagram"></i></a>
                <a href="https://open.spotify.com/show/181B1wn905QJciqTU1Ym1p?si=0bdafd228b0d4368" target="_blank"
                    style="color:rgba(255,255,255,0.4); transition:0.3s;" onmouseover="this.style.color='#1db954'"
                    onmouseout="this.style.color='rgba(255,255,255,0.4)'"><i data-lucide="music"></i></a>
            </div>

            <p style="text-align: center; color: rgba(255,255,255,0.1); font-size: 0.7rem; margin-top: 25px;">
                Radio Me Gusta &copy; 2026 | <a href="login.html" style="color:inherit; text-decoration:none;">Acceso
                    Interno</a>
            </p>
        </div>
    </div>

    <script src="js/flow-controller.js"></script>
    <script>
        function toggleAuth(type) {
            const lForm = document.getElementById('login-form');
            const rForm = document.getElementById('register-form');
            const lBtn = document.getElementById('btn-login');
            const rBtn = document.getElementById('btn-register');

            if (type === 'login') {
                lForm.style.display = 'block';
                rForm.style.display = 'none';
                lBtn.classList.add('active');
                rBtn.classList.remove('active');
            } else {
                lForm.style.display = 'none';
                rForm.style.display = 'block';
                lBtn.classList.remove('active');
                rBtn.classList.add('active');
            }
        }

        const grantAccess = () => {
            // FlowController is now global
            window.FlowController.login();
        };

        const setupForm = (id, msg) => {
            const form = document.getElementById(id);
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button');
                btn.innerText = msg;
                btn.disabled = true;
                setTimeout(grantAccess, 1500);
            });
        };

        setupForm('login-form', 'INICIANDO SESIÓN...');
        setupForm('register-form', 'CREANDO CUENTA...');

        // REVEAL LOGIC
        document.addEventListener("DOMContentLoaded", () => {
            // NEVER AUTO-REDIRECT
            setTimeout(() => {
                document.querySelectorAll("[data-reveal], .reveal").forEach(el => el.classList.add("active"));
                lucide.createIcons();
            }, 100);
        });

        // MOUSE PARALLAX
        document.addEventListener("mousemove", (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            document.querySelectorAll(".aurora-blob").forEach((blob, index) => {
                const speed = (index + 1) * 30;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body>

</html>
