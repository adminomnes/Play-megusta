<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Admin Me Gusta</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <!-- Lucide Icons -->
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i data-lucide="play-circle"></i>
                PLAY ADMIN
            </div>
            <nav class="nav-links">
                <div class="nav-item active" onclick="switchSection('dashboard')">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </div>
                <div class="nav-item" onclick="switchSection('usuarios')">
                    <i data-lucide="users"></i> Usuarios
                </div>
                <div class="nav-item" onclick="switchSection('videos')">
                    <i data-lucide="video"></i> Videos
                </div>
                <div class="nav-item" onclick="switchSection('banners')">
                    <i data-lucide="image"></i> Banners
                </div>
                <div class="nav-item" onclick="window.location.href='noticias.html'">
                    <i data-lucide="newspaper"></i> Noticias
                </div>
                <div class="nav-item" onclick="window.location.href='contacto/index.html'">
                    <i data-lucide="mail"></i> Contacto
                </div>
                <div class="nav-item logout-btn" id="logout-btn">
                    <i data-lucide="log-out"></i> Salir
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1 id="section-title">Dashboard</h1>
                <div id="user-badge" style="color:var(--accent);"></div>
            </header>

            <!-- Sections Container -->
            <div id="content-area">
                <!-- Se cargará vía JS -->
                <div class="loading-state">Cargando panel...</div>
            </div>
        </main>
    </div>

    <!-- Modals (Simple) -->
    <div id="modal-container" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 20px; color: var(--spotify-green);">Acción</h2>
            <form id="modal-form">
                <div id="modal-fields" class="form-grid"></div>
                <div class="modal-actions"
                    style="margin-top: 30px; display: flex; gap: 15px; justify-content: flex-end;">
                    <button type="button" class="btn-secondary"
                        onclick="window.appInstance.closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/admin.js"></script>
    <script>
        // Funciones globales para el Sidebar (temporal hasta main JS)
        function switchSection(name) {
            window.appInstance && window.appInstance.loadSection(name);
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.innerText.toLowerCase().includes(name)) item.classList.add('active');
            });
        }
    </script>
</body>

</html>
