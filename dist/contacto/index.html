<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Play Me Gusta</title>

    <!-- Core Styling -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../assets/a11y.css">
    <script defer src="../assets/a11y.js"></script>

    <link rel="icon" type="image/png"
        href="https://i.ibb.co/Y4phrnwx/Chat-GPT-Image-8-feb-2026-22-26-29-removebg-preview.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --contact-glow: rgba(255, 0, 110, 0.4);
            --input-bg: rgba(255, 255, 255, 0.03);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding-top: 100px;
        }

        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 5;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .contact-header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .contact-card {
            background: rgba(16, 16, 24, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: clamp(20px, 5vw, 50px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 10;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding-left: 5px;
        }

        input,
        select,
        textarea {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 15px 20px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ff006e;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
            accent-color: #ff006e;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff006e, #ff00ff);
            border: none;
            color: #fff;
            padding: 18px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 0, 110, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Messages */
        #status-msg {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        #status-msg.success {
            background: rgba(0, 255, 127, 0.1);
            color: #00ff7f;
            border: 1px solid rgba(0, 255, 127, 0.2);
            display: block;
        }

        #status-msg.error {
            background: rgba(255, 0, 85, 0.1);
            color: #ff0055;
            border: 1px solid rgba(255, 0, 85, 0.2);
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contact-card {
                padding: 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .contact-header h1 {
                font-size: 2.8rem;
            }
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading .spinner {
            display: block;
        }

        .loading .btn-text {
            visibility: hidden;
            width: 0;
        }

        /* Hidden Honeypot */
        .hp-field {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <nav class="navbar scrolled" id="navbar">
        <div class="logo" onclick="window.location.href='../play.html'" role="button" tabindex="0">
            <img src="https://i.ibb.co/Y4phrnwx/Chat-GPT-Image-8-feb-2026-22-26-29-removebg-preview.png"
                alt="Play Me Gusta" style="height: 40px;">
        </div>
        <div class="nav-links">
            <a href="../play.html">Home</a>
            <a href="../programas/index.html">Programas</a>
            <a href="../tv-en-vivo.html">TV en Vivo</a>
            <a href="../noticias.html">Noticias</a>
            <a href="index.html" class="active">Contacto</a>
        </div>
        <div class="nav-actions">
            <div style="width: 35px; height: 35px; background: linear-gradient(135deg, #ff006e, #ff00ff); border-radius: 50%; cursor: pointer;"
                onclick="window.location.href='../profiles.html'"></div>
        </div>
    </nav>

    <main class="contact-container" id="main">
        <header class="contact-header">
            <h1>Hablemos</h1>
            <p>¿Tienes dudas, sugerencias o quieres publicitar tu marca? Cuéntanos.</p>
        </header>

        <section class="contact-card">
            <form id="contact-form">
                <!-- Honeypot -->
                <div class="hp-field">
                    <input type="text" name="website" id="hp_website" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Nombre Completo *</label>
                        <input type="text" id="name" name="name" placeholder="Ej: Juan Pérez" required
                            aria-required="true">
                    </div>
                    <div class="form-group">
                        <label for="email">Email de contacto *</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required
                            aria-required="true">
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono (opcional)</label>
                        <input type="tel" id="phone" name="phone" placeholder="+56 9 ...">
                    </div>
                    <div class="form-group">
                        <label for="subject">Motivo de contacto *</label>
                        <select id="subject" name="subject" required aria-required="true">
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Soporte">Soporte Técnico</option>
                            <option value="Suscripcion">Suscripción / Registro</option>
                            <option value="Contenido">Contenido / Playlist</option>
                            <option value="Publicidad">Publicidad / Alianzas</option>
                            <option value="Otro">Otro motivo</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="message">Tu mensaje o necesidad *</label>
                        <textarea id="message" name="message" rows="5" placeholder="Cuéntanos más detalles..." required
                            aria-required="true"></textarea>
                    </div>
                </div>

                <div class="form-group full">
                    <label class="checkbox-group">
                        <input type="checkbox" name="consent" required aria-required="true">
                        <span>Acepto ser contactado por Radio Me Gusta para resolver mi solicitud.</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <div class="spinner"></div>
                    <span class="btn-text">Enviar Mensaje</span>
                </button>

                <div id="status-msg"></div>
            </form>
        </section>
    </main>

    <footer style="padding: 60px 20px; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.9rem;">
        <p>&copy; 2026 Radio Me Gusta. Tu imperio musical.</p>
    </footer>

    <script>
        console.log("Contacto page loaded");
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('status-msg');

            // UI State: Loading
            btn.disabled = true;
            btn.classList.add('loading');
            status.style.display = 'none';

            const formData = {
                name: form.name.value,
                email: form.email.value,
                phone: form.phone.value,
                subject: form.subject.value,
                message: form.message.value,
                website: form.website.value // Honeypot
            };

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.ok) {
                    status.textContent = '¡Mensaje enviado con éxito! Te responderemos muy pronto.';
                    status.className = 'success';
                    form.reset();
                } else {
                    status.textContent = result.error || 'Ocurrió un error inesperado. Reintenta.';
                    status.className = 'error';
                }
            } catch (err) {
                status.textContent = 'No se pudo conectar con el servidor. Verifica tu internet.';
                status.className = 'error';
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                status.style.display = 'block';
            }
        });

        // Simple real-time validation for email
        document.getElementById('email').addEventListener('input', (e) => {
            const email = e.target.value;
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            e.target.style.borderColor = isValid ? 'rgba(255,255,255,0.1)' : '#ff0055';
        });
    </script>
</body>

</html>
