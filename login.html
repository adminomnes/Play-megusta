<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Admin Me Gusta</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="assets/a11y.css">
    <script defer src="assets/a11y.js"></script>
    <style>
        body {
            background: #000;
            font-family: 'Outfit', sans-serif;
        }

        .login-wrap {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 800;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1db954;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            background: #1db954;
            border: none;
            color: #000;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-secondary {
            background: none;
            color: #b3b3b3;
            font-size: 0.9rem;
            margin-top: 15px;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="main" class="login-wrap">
        <div class="login-card" id="auth-container">
            <h1 id="auth-title">ADMIN PANEL</h1>

            <form id="auth-form">
                <div class="input-group" id="user-group" style="display: none;">
                    <input type="text" id="username" placeholder="Nombre de Usuario">
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-action" id="btn-main">INGRESAR</button>
            </form>

            <button class="btn-secondary" id="btn-toggle">¿No tienes cuenta? Registrarme</button>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>

</html>
